spring.application.name=Project-3-springboot


server.port=8089


# View Resolver configuration
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Static resources configuration
spring.mvc.static-path-pattern=/static/**


sitemesh.integration=filter



sitemesh.decorator.prefix=/decorators/
sitemesh.decorator.default=web.jsp

sitemesh.dispatchMode=include

debug=true


logging.level.org.sitemesh=TRACE
logging.level.org.sitemesh.webmvc=TRACE
